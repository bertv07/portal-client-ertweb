version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ertweb_postgres
    restart: always
    environment:
      POSTGRES_USER: ertweb_user
      POSTGRES_PASSWORD: ertweb_password
      POSTGRES_DB: ertweb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - easypanel

  api-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ertweb_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ertweb_user:ertweb_password@db:5432/ertweb_db
    networks:
      - easypanel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.api-backend.rule=Host(`api.ertweb.com`)"
      - "traefik.http.routers.api-backend.tls=true"
      - "traefik.http.routers.api-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-backend.loadbalancer.server.port=8000"

  app-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ertweb_app
    restart: unless-stopped
    depends_on:
      - api-backend
    env_file:
      - ./frontend/.env
    networks:
      - easypanel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.app-frontend.rule=Host(`portal.ertweb.com`)"
      - "traefik.http.routers.app-frontend.tls=true"
      - "traefik.http.routers.app-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-frontend.loadbalancer.server.port=80"

volumes:
  postgres_data:

networks:
  easypanel:
    external: true
