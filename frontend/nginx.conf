server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver interno de Docker: re-resuelve la IP de api-backend en cada
  # request (con proxy_pass fijo, nginx congela la IP al arrancar y devuelve
  # 502 cuando el backend se reconstruye y cambia de IP).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api-backend:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos subidos (documentos, facturas, comprobantes) los sirve el backend
  location /uploads/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
